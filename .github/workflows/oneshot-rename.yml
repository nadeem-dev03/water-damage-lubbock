name: One-shot rename to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename upload to index.html
        run: |
          set -e
          test -f water-damage-lubbock-fixwell.html || { echo "upload missing"; exit 1; }
          rm -f index.html
          mv water-damage-lubbock-fixwell.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Rename water-damage-lubbock-fixwell.html to index.html (Fixwell style)"
          git push
