name: One-shot rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename upload to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv -f water-damage-lubbock.html index.html
          git add -A
          git commit -m "Rename water-damage-lubbock.html to index.html" || echo "Nothing to commit"
          git push
