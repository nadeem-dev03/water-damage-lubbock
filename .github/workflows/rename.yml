name: Rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "nadeem-dev03"
          git config user.email "nadeem-dev03@users.noreply.github.com"
          git mv water-damage-lubbock.html index.html
          git commit -m "Rename water-damage-lubbock.html to index.html"
          git push
