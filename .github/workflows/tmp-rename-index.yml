name: Temporary one-shot rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded export to sole index.html
        run: |
          set -e
          test -f water-damage-lubbock-806-number.html
          mv -f water-damage-lubbock-806-number.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Rename water-damage-lubbock-806-number.html to sole index.html"
          git push
